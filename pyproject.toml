[project]
name = "pdc-python-client"
version = "0.3.0"
description = "Python client for the Philanthropy Data Commons (PDC) API"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Philanthropy Data Commons" }]
maintainers = [{ name = "DrivenData", email = "info@drivendata.org" }]
requires-python = ">=3.12"
keywords = ["philanthropy", "philanthropy data commons", "pdc", "grantmaking", "api client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "requests>=2.34",
  "urllib3>=2",
]

[project.optional-dependencies]
testing = ["responses>=0.23"]
seeding = ["faker>=26", "python-keycloak>=6"]

[project.urls]
Repository = "https://github.com/PhilanthropyDataCommons/pdc-python-client"
Issues = "https://github.com/PhilanthropyDataCommons/pdc-python-client/issues"
Changelog = "https://github.com/PhilanthropyDataCommons/pdc-python-client/blob/main/CHANGELOG.md"
"PDC API" = "https://api.philanthropydatacommons.org/"

[dependency-groups]
dev = [
  "datamodel-code-generator[ruff]>=0.87",
  "ruff>=0.17",
  { include-group = "tests" },
  { include-group = "typecheck" },
]
tests = [
  "pdc-python-client[seeding,testing]",
  "pytest-cov>=7",
  "pytest>=9",
]
typecheck = [
  "mypy>=2.4.1",
  "pyrefly>=1.4.1",
  "ty>=0.0.100",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pdc_api_client"
source-include = [
  "CHANGELOG.md",
  "codegen/*.py",
  "integration_tests/*.py",
  "integration_tests/pytest.ini",
  "just/*.just",
  "justfile",
  "tests/*.py",
]
wheel-exclude = ["pdc_api_client/openapi.json"]

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.paths]
pdc_api_client = ["src/pdc_api_client/", "*/site-packages/pdc_api_client/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=pdc_api_client", "--cov-report=term-missing"]

[tool.mypy]
files = ["src", "tests", "integration_tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pyrefly]
project-includes = ["src", "tests", "integration_tests"]
search-path = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests", "integration_tests"]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/pdc_api_client/_generated.py"]

[tool.ruff.lint]
extend-select = ["I", "S", "INT", "PLC0415"]
unfixable = ["F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S107", "S603"]
"integration_tests/**" = ["S101", "S105", "S106", "S107", "S603"]

[tool.uv]
exclude-newer = "1 week"
