name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      upgrade:
        description: Upgrade locked dependencies before running tests
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.55.0" # Keep in sync with minimum-version in justfile
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: lint
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Lint and check formatting
        run: just lint
      - name: Build the package
        run: uv build
      - name: Check generated models match the spec
        run: |
          just codegen
          git diff --exit-code src/pdc_api_client/_generated.py

  zizmor:
    name: Zizmor audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  unit-tests-and-type-checks:
    name: Unit tests and type checks (Python ${{ matrix.python }}${{ matrix.lowest_direct && ', lowest direct dependencies' || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            lowest_direct: true
          - python: "3.14"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.55.0" # Keep in sync with minimum-version in justfile
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: tests-py${{ matrix.python }}${{ matrix.lowest_direct && '-lowest-direct' || '' }}
      - name: Run the unit tests
        run: just test --python="$PYTHON" ${LOWEST_DIRECT:+--lowest-direct} ${UPGRADE:+--upgrade}
        env:
          PYTHON: ${{ matrix.python }}
          LOWEST_DIRECT: ${{ matrix.lowest_direct && 'true' || '' }}
          UPGRADE: ${{ (github.event_name == 'schedule' || inputs.upgrade) && 'true' || '' }}
      - name: Run the type checks
        run: just typecheck --python="$PYTHON" ${LOWEST_DIRECT:+--lowest-direct}
        if: ${{ !cancelled() }}
        env:
          PYTHON: ${{ matrix.python }}
          LOWEST_DIRECT: ${{ matrix.lowest_direct && 'true' || '' }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the PDC service repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PhilanthropyDataCommons/service
          path: service
      - name: Add hosts entries for the PDC stack
        run: echo "127.0.0.1 pdc-api pdc-auth pdc-s3" | sudo tee -a /etc/hosts
      - name: Start the PDC stack
        working-directory: service
        run: docker compose -f compose-ci.yml up -d --wait
        timeout-minutes: 5
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.55.0" # Keep in sync with minimum-version in justfile
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: integration
      - name: Run the integration tests
        run: just integration ${UPGRADE:+--upgrade}
        timeout-minutes: 5
        env:
          UPGRADE: ${{ (github.event_name == 'schedule' || inputs.upgrade) && 'true' || '' }}

  all-green:
    name: All green
    if: always()
    needs: [lint, zizmor, unit-tests-and-type-checks, integration]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check that every required job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  notify:
    name: Notify failed build
    needs: [lint, zizmor, unit-tests-and-type-checks, integration]
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed build
        uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
