name: Release
run-name: Release ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, such as v1.2.3
        required: true
      dry-run:
        description: Dry run (upload to Test PyPI only, and skip the PyPI upload and the GitHub release)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check-version:
    name: Check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check that a real release runs from main
        if: ${{ !inputs.dry-run }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Releases run from main, not $GITHUB_REF"
            exit 1
          fi
      - name: Check that the tag matches the package version
        run: |
          package_version=$(uv version --short --frozen)
          echo "Tag: $INPUTS_VERSION, package version: $package_version"
          [[ "$INPUTS_VERSION" == "v$package_version" ]]
        env:
          INPUTS_VERSION: ${{ inputs.version }}
      - name: Check that the tag doesn't exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$INPUTS_VERSION"; then
            echo "Tag $INPUTS_VERSION already exists"
            exit 1
          fi
        env:
          INPUTS_VERSION: ${{ inputs.version }}

  extract-changelog:
    name: Extract the changelog entry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ENVIRON rather than -v so the version is compared as a literal string, never as a regex.
      - name: Check the changelog has a released heading for this version
        run: |
          VERSION="${INPUTS_VERSION#v}" awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / && $2 == ENVIRON["VERSION"] { ok = tolower($0) !~ /unreleased/; exit }
            END { exit !ok }
          ' CHANGELOG.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}
      - name: Extract the changelog entry
        run: |
          VERSION="${INPUTS_VERSION#v}" awk '
            /^(```|~~~)/ { fence = !fence }
            !fence && /^## / { if (found) exit; if ($2 == ENVIRON["VERSION"]) { found = 1; next } }
            found
          ' CHANGELOG.md > __CHANGELOG-extracted.md
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}
      - name: Check the extracted entry isn't empty
        run: grep -q '[^[:space:]]' __CHANGELOG-extracted.md
      - name: Upload the extracted entry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-extracted
          path: __CHANGELOG-extracted.md

  build:
    name: Build and inspect the package
    needs: [check-version, extract-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Build provenance attestation
      attestations: write # Build provenance attestation
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect the package
        uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ !inputs.dry-run }}

  upload-to-test-pypi:
    name: Upload to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Upload to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload-to-pypi:
    name: Upload to PyPI
    needs: upload-to-test-pypi
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create the GitHub release
    needs: [upload-to-test-pypi, upload-to-pypi]
    if: ${{ !cancelled()
            && needs.upload-to-test-pypi.result == 'success'
            && (needs.upload-to-pypi.result == 'success' || needs.upload-to-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the tag and release
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Download the extracted changelog entry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-extracted
      - name: Show what the release would contain
        if: ${{ inputs.dry-run }}
        run: |
          echo "Tag $INPUTS_VERSION on $GITHUB_SHA"
          ls dist
          cat __CHANGELOG-extracted.md
        env:
          INPUTS_VERSION: ${{ inputs.version }}
      - name: Create the GitHub release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "$INPUTS_VERSION" \
            --title "$INPUTS_VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file __CHANGELOG-extracted.md \
            dist/*.whl \
            dist/*.tar.gz
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
